[package]
name = "escrow-chain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
escrow-core = { version = "0.1.0", path = "../escrow-core" }
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
stellar-strkey = "1.0.0"
stellar-xdr = { version = "30.0.0", features = ["std", "base64", "serde"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
axum = "0.8.9"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time"] }
