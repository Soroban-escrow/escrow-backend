[package]
name = "escrow-chain-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
base64 = "0.23.1"
libfuzzer-sys = "0.4"
stellar-xdr = { version = "30.0.0", features = ["std", "base64"] }

[dependencies.escrow-chain]
path = ".."

[[bin]]
name = "decode_event"
path = "fuzz_targets/decode_event.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_scval"
path = "fuzz_targets/decode_scval.rs"
test = false
doc = false
bench = false
