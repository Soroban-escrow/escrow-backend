[package]
name = "escrow-payouts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = "0.4.45"
escrow-chain = { version = "0.1.0", path = "../escrow-chain" }
escrow-core = { version = "0.1.0", path = "../escrow-core" }
escrow-db = { version = "0.1.0", path = "../escrow-db" }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "sync", "macros"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "chrono"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
