[package]
name = "escrow-github"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
escrow-core = { version = "0.1.0", path = "../escrow-core" }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
aws-lc-rs = "1.19.0"
axum = "0.8.9"
base64 = "0.23.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time"] }
