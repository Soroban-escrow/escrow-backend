[package]
name = "escrow-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = "0.4.45"
escrow-core = { version = "0.1.0", path = "../escrow-core" }
escrow-db = { version = "0.1.0", path = "../escrow-db" }
escrow-github = { version = "0.1.0", path = "../escrow-github" }
hex = "0.4.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
axum = "0.8.9"
escrow-testkit = { path = "../escrow-testkit" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "chrono"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
