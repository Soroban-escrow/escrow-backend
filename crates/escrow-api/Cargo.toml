[package]
name = "escrow-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
escrow-chain = { version = "0.1.0", path = "../escrow-chain" }
escrow-core = { version = "0.1.0", path = "../escrow-core" }
escrow-db = { version = "0.1.0", path = "../escrow-db" }
escrow-engine = { version = "0.1.0", path = "../escrow-engine" }
escrow-github = { version = "0.1.0", path = "../escrow-github" }
escrow-payouts = { version = "0.1.0", path = "../escrow-payouts" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "set-header", "limit", "request-id", "timeout"] }
tracing = "0.1.44"

[dev-dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
escrow-testkit = { path = "../escrow-testkit" }
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.5"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "chrono"] }
stellar-strkey = "1.0.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5.3", features = ["util"] }
