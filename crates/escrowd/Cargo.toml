[package]
name = "escrowd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
escrow-ai = { version = "0.1.0", path = "../escrow-ai" }
escrow-api = { version = "0.1.0", path = "../escrow-api" }
escrow-chain = { version = "0.1.0", path = "../escrow-chain" }
escrow-core = { version = "0.1.0", path = "../escrow-core" }
escrow-db = { version = "0.1.0", path = "../escrow-db" }
escrow-engine = { version = "0.1.0", path = "../escrow-engine" }
escrow-github = { version = "0.1.0", path = "../escrow-github" }
escrow-payouts = { version = "0.1.0", path = "../escrow-payouts" }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
