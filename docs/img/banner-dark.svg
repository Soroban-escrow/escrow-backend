<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="SkillEscrow backend, written in Rust: the chain is the source of truth">
  <rect width="1200" height="340" fill="#0e0e0d"/>
  <rect x="0" y="0" width="1200" height="4" fill="#c9f25d"/>

  <rect x="72" y="58" width="14" height="14" rx="3" fill="#c9f25d" stroke="#efeee9" stroke-width="2"/>
  <text x="98" y="71" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#efeee9">skillescrow / escrow-backend</text>

  <text x="72" y="150" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="62" fill="#efeee9">The chain is the</text>
  <text x="72" y="214" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="62" font-style="italic" fill="#c9f25d">source of truth.</text>

  <text x="72" y="250" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="#9b998f">A Rust backend that indexes a Soroban escrow contract,</text>
  <text x="72" y="274" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="#9b998f">watches GitHub, and pays the contributor on merge.</text>
  <text x="72" y="298" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="#9b998f">One binary. One Postgres. No Redis.</text>

  <line x1="772" y1="120" x2="1128" y2="120" stroke="#2a2925" stroke-width="2"/>
  <line x1="772" y1="120" x2="1008" y2="120" stroke="#efeee9" stroke-width="2"/>
  <circle cx="772" cy="120" r="7" fill="#efeee9"/>
  <circle cx="890" cy="120" r="7" fill="#efeee9"/>
  <circle cx="1008" cy="120" r="7" fill="#c9f25d" stroke="#efeee9" stroke-width="2"/>
  <circle cx="1128" cy="120" r="7" fill="#0e0e0d" stroke="#2a2925" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#9b998f" text-anchor="middle">
    <text x="772" y="152">webhook</text>
    <text x="890" y="152">queue</text>
    <text x="1008" y="152">relayer</text>
    <text x="1128" y="152">on-chain</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#efeee9">
    <rect x="772" y="196" width="356" height="92" rx="8" fill="none" stroke="#2a2925" stroke-width="2"/>
    <text x="792" y="226" fill="#9b998f">release:&lt;bounty&gt;</text>
    <text x="792" y="252">hash stored <tspan fill="#c9f25d">before</tspan> waiting</text>
    <text x="792" y="274" fill="#9b998f">one payout per bounty, ever</text>
  </g>
</svg>
